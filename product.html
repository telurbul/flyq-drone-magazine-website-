  <img class="drone-bg__item" data-depth="0.58" src="drone6.png" alt="">

<a class="skip-link" href="#main" data-i18n="skipLink">Перейти до основного контенту</a>

  <symbol id="icon-drone" viewBox="0 0 64 64">

      <circle cx="50" cy="11" r="6.4"/>
      <circle cx="14" cy="53" r="6.4"/>
      <circle cx="50" cy="53" r="6.4"/>
    </g>
  </symbol>
  <symbol id="icon-play" viewBox="0 0 24 24">
    <path d="M8 5.5v13l11-6.5-11-6.5Z" fill="currentColor"/>

  <symbol id="icon-instagram" viewBox="0 0 24 24">

    <rect x="2" y="9" width="4" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- ============ HEADER (product-page variant: back button instead of auth) ============ -->
<header class="site-header" id="siteHeader">
  <div class="site-header__inner">

    <div class="site-header__auth">
      <a class="btn btn--ghost btn--back" href="index.html">
        <svg class="icon is-prev" width="14" height="14"><use href="#icon-chevron"></use></svg>
        <span data-i18n="navHome">На головну</span>
      </a>
    </div>

    <a class="site-header__logo" href="index.html" data-i18n-aria="logoAriaHome" aria-label="VCD — на головну">
      <img src="logo.png" alt="VCD" width="52" height="52" class="js-logo">
    </a>

    <div class="site-header__menu">
      <nav class="site-nav" id="siteNav" data-i18n-aria="mainNavAria" aria-label="Основна навігація">
        <a href="index.html#our-products" data-i18n="navCatalog">Каталог</a>
        <a href="cart.html" data-i18n="navCart">Кошик</a>
        <a href="index.html#site-footer" data-i18n="navContacts">Контакти</a>
      </nav>
      <button class="menu-toggle" type="button" id="menuToggle" aria-expanded="false" aria-controls="siteNav">
        <span class="menu-toggle__label" data-i18n="menuLabel">Меню</span>
        <svg class="icon menu-toggle__icon" width="18" height="18"><use href="#icon-menu"></use></svg>
      </button>
    </div>

  </div>
</header>

<main id="main">

  <!-- ============ PRODUCT HERO — gallery + buy box ============ -->
  <section class="product-hero">

    <div class="product-hero__gallery">
      <div class="gallery__frame" id="galleryFrame">
        <div class="gallery__photo" id="galleryPhoto"></div>
        
        <span class="gallery__more-msg" id="galleryMoreMsg" data-i18n="galleryMore">додаткові фото скоро з'являться</span>
        <span class="gallery__corner corner corner--tl"></span>
        <span class="gallery__corner corner corner--tr"></span>
        <span class="gallery__corner corner corner--bl"></span>
        <span class="gallery__corner corner corner--br"></span>
      </div>
      <button class="gallery__arrow gallery__arrow--prev" type="button" id="galleryPrev" data-i18n-aria="galleryPrev" aria-label="Попередній вигляд">
        <svg class="icon" width="20" height="20"><use href="#icon-chevron"></use></svg>
      </button>
      <button class="gallery__arrow gallery__arrow--next" type="button" id="galleryNext" data-i18n-aria="galleryNext" aria-label="Наступний вигляд">
        <svg class="icon" width="20" height="20"><use href="#icon-chevron"></use></svg>
      </button>
      <div class="gallery__dots" id="galleryDots"></div>
    </div>

    <div class="product-hero__info">
      <h1 class="product-hero__name"><span class="rail__tick" aria-hidden="true"></span><span id="productNameText">—</span></h1>
      <p class="product-hero__tag" id="productTag"></p>

      <p class="product-hero__desc" id="productDescP1"></p>
      <p class="product-hero__desc" id="productDescP2"></p>

      <div class="product-buy">
        <div class="product-buy__price" id="productPrice">—</div>
        <div class="qty-stepper">
          <button class="qty-stepper__btn" type="button" id="qtyMinus" data-i18n-aria="qtyMinus" aria-label="Зменшити кількість">−</button>
          <span class="qty-stepper__value" id="qtyValue">1</span>
          <button class="qty-stepper__btn" type="button" id="qtyPlus" data-i18n-aria="qtyPlus" aria-label="Збільшити кількість">+</button>
        </div>
      </div>

      <button class="btn btn--order" type="button" id="orderBtn" data-i18n="orderBtn">Замовити</button>
    </div>
  </section>

  <!-- ============ SECONDARY DESCRIPTION ============ -->
  <section class="product-extra">
    <h2 class="product-extra__heading" id="extraHeading"></h2>
    <p class="product-extra__text" id="extraText"></p>
  </section>

  <!-- ============ VIDEO ============ -->
  <section class="product-video">
    <div class="video-player" id="videoPlayer">
      <video id="productVideo" preload="none" playsinline></video>
      <button class="video-player__play" type="button" id="videoPlayBtn" data-i18n-aria="videoPlay" aria-label="Відтворити відео">
        <svg class="icon icon--play" width="30" height="30"><use href="#icon-play"></use></svg>
        <svg class="icon icon--pause" width="26" height="26"><use href="#icon-pause"></use></svg>
      </button>
      <div class="video-player__track" id="videoTrack">
        <div class="video-player__bar">
          <div class="video-player__progress" id="videoProgress"></div>
          <span class="video-player__handle" id="videoHandle"></span>
        </div>
      </div>
      <p class="video-player__notice" data-i18n="videoNotice">Відеоогляд цієї моделі скоро з’явиться</p>
    </div>
  </section>

</main>

<!-- ============ FOOTER ============ -->
<footer class="site-footer" id="site-footer">
  <div class="site-footer__inner">

    <div class="site-footer__brand">
      <img src="logo.png" alt="FLYQ" width="55" height="55" class="site-footer__logo js-logo">
      <div class="site-footer__brand-text">
        <p class="site-footer__name">FLYQ</p>
        <p class="site-footer__tagline">Знаряддя як праці, так і помсти</p>
      </div>
    </div>

    <div class="site-footer__contact">
      <a class="site-footer__phone" href="tel:+380505809421">
        <svg class="icon" width="17" height="17"><use href="#icon-phone"></use></svg>
        <span>+380&nbsp;50&nbsp;580&nbsp;94&nbsp;21</span>
      </a>
      <div class="site-footer__social">
        <a href="https://www.linkedin.com/in/yaroslav-melnyk-b37ba122b/" target="_blank" rel="noopener noreferrer" aria-label="VCD у LinkedIn"><svg class="icon" width="19" height="19"><use href="#icon-linkedin"></use></svg></a>
        <a href="https://github.com/telurbul" target="_blank" rel="noopener noreferrer" aria-label="VCD у GitHub"><svg class="icon" width="19" height="19"><use href="#icon-github"></use></svg></a>
        <a href="https://t.me/alfreichel" target="_blank" rel="noopener noreferrer" aria-label="VCD у Telegram"><svg class="icon" width="19" height="19"><use href="#icon-telegram"></use></svg></a>
      </div>
    </div>

  </div>

  <div class="site-footer__bottom">
    <p>© <span id="year">2026</span> VCD. made by MELNIK YAROSLAV.</p>
  </div>
</footer>

<script src="script.js"></script>
<script src="script.prod.js"></script>
</body>
</html>
