<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="titleCart">Кошик — VCD</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles.prod.css">
  <link rel="stylesheet" href="styles.cart.css">
  <style>
    /* Shared styles.css sets body{min-height:130vh} for the long landing
       page. On a short page like this cart (especially when empty) that
       leaves a large blank gradient gap below the footer instead of the
       footer sitting at the bottom. Override scoped to this page only,
       with a real sticky-footer flex layout instead. */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main.cart-page {
      flex: 1 0 auto;
    }
    .site-footer {
      flex-shrink: 0;
    }

    .cart-page {
      max-width: var(--container);
      margin: 0 auto;
      padding: calc(var(--header-h) + 2rem) var(--pad-inline) 0;
      min-height: 60vh;
    }
    .cart-container {
      width: 100%;
    }
    .cart-heading {
      display: flex;
      align-items: center;
      gap: .75rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.3rem, 3vw, 1.9rem);
      margin-bottom: 1.5rem;
    }
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .cart-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--ink);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      transition: background 0.2s;
    }
    .cart-item:hover {
      background: var(--ink-soft);
    }
    .cart-item__img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .cart-item__info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .cart-item__name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1rem;
    }
    .cart-item__qty {
      color: var(--paper-dim);
      font-size: 0.85rem;
    }
    .cart-item__price {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      white-space: nowrap;
      color: var(--accent);
    }
    .cart-item__remove {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(231,58,59,0.15);
      color: var(--accent);
      font-size: 1rem;
      transition: background 0.2s;
      cursor: pointer;
      border: none;
    }
    .cart-item__remove:hover {
      background: rgba(231,58,59,0.35);
    }
    .cart-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--paper-dim);
      font-size: 1.1rem;
    }
    .cart-empty a {
      color: var(--accent);
      text-decoration: underline;
    }
    .cart-actions {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .cart-actions .btn--order {
      display: inline-block;
      width: auto;
      min-width: 220px;
    }
    .cart-add-more {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
    }
    .cart-add-more__icon {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(231,58,59,0.15);
      color: var(--accent);
      font-size: 1rem;
      line-height: 1;
    }
  </style>
</head>
<body>

<svg class="icon-sprite" aria-hidden="true" focusable="false">

    <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-phone" viewBox="0 0 24 24">
    <path d="M6.7 2.6 9.5 3.8c.5.2.7.8.5 1.3l-1 2.5c-.2.5-.7.7-.7 1.3.5 2.5 2.4 4.4 4.9 4.9.5.1.8-.4 1.3-.6l2.5-1c.5-.2 1.1 0 1.3.5l1.2 2.8c.2.5 0 1.1-.4 1.4-1 .7-2.3 1.1-3.5.9C11 17.3 6.8 13.1 6.4 8c-.2-1.2.2-2.5.9-3.5.3-.4.9-.6 1.4-.4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-instagram" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <circle cx="17.3" cy="6.7" r="1.15" fill="currentColor"/>
  </symbol>
  <symbol id="icon-linkedin" viewBox="0 0 24 24">
    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="2" y="9" width="4" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="4" cy="4" r="2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-github" viewBox="0 0 24 24">
    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-telegram" viewBox="0 0 24 24">
    <path d="M21.4 4.1 2.8 11.4c-1 .4-1 1.6.1 1.9l4.4 1.3 1.7 5.4c.3.9 1.5 1.1 2.1.3l2.4-2.8 4.6 3.4c.8.6 2 .2 2.2-.8L22.4 5c.2-.9-.9-1.6-1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M9 14.6 18.7 6l-8.2 7.4-.2 3.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-menu" viewBox="0 0 24 24">
    <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
</svg>

<header class="site-header" id="siteHeader">
  <div class="site-header__inner">
    <div class="site-header__auth">
      <a class="btn btn--ghost btn--back" href="index.html">
        <svg class="icon is-prev" width="14" height="14"><use href="#icon-chevron"></use></svg>
        <span data-i18n="navHome">На головну</span>
      </a>
    </div>
    <a class="site-header__logo" href="index.html" data-i18n-aria="logoAriaHome" aria-label="VCD — на головну">
      <img src="logo.png" alt="VCD" width="52" height="52">
    </a>
    <div class="site-header__menu">
      <nav class="site-nav" id="siteNav" data-i18n-aria="mainNavAria" aria-label="Основна навігація">
        <a href="index.html#our-products" data-i18n="navCatalog">Каталог</a>
        <a href="index.html#site-footer" data-i18n="navContacts">Контакти</a>
      </nav>
    </div>
  </div>
</header>

<main class="cart-page">
  <div class="cart-container">
    <h2 class="cart-heading"><span class="rail__tick" aria-hidden="true"></span><span data-i18n="cartHeading">Ваш кошик</span></h2>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-actions" id="cartActions" style="display:none;">
      <a class="cart-add-more" href="index.html#our-products">
        <span class="cart-add-more__icon" aria-hidden="true">+</span>
        <span data-i18n="cartAddMore">Замовити ще</span>
      </a>
      <button class="btn btn--order" onclick="checkout()" data-i18n="cartCheckout">Оформити замовлення</button>
    </div>
  </div>
</main>

<div id="stockWarning" class="warning-overlay" style="display:none;">
  <div class="warning-modal">
    <div class="warning-modal__header">
      <span class="warning-modal__icon">⚠</span>
      <h2 class="warning-title" data-i18n="stockTitle">Товар відсутній</h2>
    </div>
    <p class="warning-text" data-i18n-html="stockText">
      Вибачте, товар зараз не в наявності.<br>
      Ми повідомимо вас про появу.
    </p>
    <button id="stockWarningClose" class="warning-btn" onclick="closeBanner()">
      <span class="warning-btn__text" data-i18n="stockContinue">Продовжити</span>
      <span class="warning-btn__arrow">&rarr;</span>
    </button>
  </div>
</div>

<footer class="site-footer" id="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <img src="logo.png" alt="VCD" width="44" height="44" class="site-footer__logo">
      <div class="site-footer__brand-text">
        <p class="site-footer__name">VCD</p>
        <p class="site-footer__tagline" data-i18n="footerTagline">Знаряддя як праці, так і помсти</p>
      </div>
    </div>
    <div class="site-footer__contact">
      <a class="site-footer__phone" href="tel:+380505809421">
        <svg class="icon" width="17" height="17"><use href="#icon-phone"></use></svg>
        <span>+380&nbsp;50&nbsp;580&nbsp;94&nbsp;21</span>
      </a>
      <div class="site-footer__social">
        <a href="https://www.linkedin.com/in/yaroslav-melnyk-b37ba122b/" target="_blank" rel="noopener noreferrer" aria-label="VCD у LinkedIn"><svg class="icon" width="19" height="19"><use href="#icon-linkedin"></use></svg></a>
        <a href="https://github.com/telurbul" target="_blank" rel="noopener noreferrer" aria-label="VCD у GitHub"><svg class="icon" width="19" height="19"><use href="#icon-github"></use></svg></a>
        <a href="https://t.me/alfreichel" target="_blank" rel="noopener noreferrer" aria-label="VCD у Telegram"><svg class="icon" width="19" height="19"><use href="#icon-telegram"></use></svg></a>
      </div>
    </div>
  </div>
  <div class="site-footer__bottom">
    <p>© 2025 VCD. made by MELNIK YAROSLAV.</p>
  </div>
</footer>

<script src="script.js"></script>
<script>
  function renderCart() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const container = document.getElementById('cart-items');
    const actions = document.getElementById('cartActions');

    container.innerHTML = '';

    if (cart.length === 0) {
      container.innerHTML = `<p class="cart-empty">${tr('cartEmpty')} <a href="index.html#our-products">${tr('cartToCatalog')}</a></p>`;
      if (actions) actions.style.display = 'none';
      return;
    }

    if (actions) actions.style.display = 'block';

    cart.forEach((item, index) => {
      const qty = item.quantity || 1;
      const total = (item.price || 0) * qty;

      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerHTML = `
        <img src="${item.image}" alt="${item.name}" class="cart-item__img">
        <div class="cart-item__info">
          <span class="cart-item__name">${item.name}</span>
          <span class="cart-item__qty">× ${qty}</span>
        </div>
        <span class="cart-item__price">${total.toLocaleString('uk-UA')} ₴</span>
        <button class="cart-item__remove" onclick="removeItem(${index})" aria-label="${tr('cartRemove')} ${item.name}">✕</button>
      `;
      container.appendChild(div);
    });
  }

  function removeItem(index) {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
  }

  function checkout() {
    const warning = document.getElementById('stockWarning');
    if (warning) warning.style.display = 'flex';
  }

  function closeBanner() {
    const warning = document.getElementById('stockWarning');
    if (warning) warning.style.display = 'none';
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeBanner();
  });

  document.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
</html>
